[project]
name = "medifind-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AMAN-349", email = "smantyagi349@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "googleapis-common-protos>=1.76.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit[auth]>=1.66.1",
]

[project.scripts]
medifind-ai = "medifind_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
